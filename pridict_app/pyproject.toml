[project]
name = "pridict"
authors = [
    { name = "RiditStack" },
]
description = "Pridict branding and Enterprise UI for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Agent Studio runtime (graph execution, interrupts, checkpoints)
    "langgraph>=1.2,<2",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.120.1,<16.0.0"
erpnext = ">=15.121.2,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
