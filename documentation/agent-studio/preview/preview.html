<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Studio preview</title>
<!--
	Standalone preview of the Agent Studio pages without a Frappe server.
	Open in a browser: preview.html?page=agent-registry
	Optional: &click=<css selector> clicks an element after load (used for screenshots).
	It stubs only the small part of the Frappe API the pages use.
-->
<style>
	:root {
		--text-color: #1f272e; --text-muted: #6b7280; --border-color: #e2e6ea; --card-bg: #ffffff;
		--fg-color: #ffffff; --control-bg: #f3f5f7; --primary: #416de4;
		--font-family-monospace: ui-monospace, "Cascadia Code", Consolas, monospace;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: #f7f8fa; font: 13px/1.45 "Segoe UI", Inter, system-ui, sans-serif; color: var(--text-color); }
	.pv-top { height: 48px; background: #fff; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 24px; gap: 14px; }
	.pv-top b { font-size: 16px; letter-spacing: .02em; color: #1e3a8a; }
	.pv-top span { color: var(--text-muted); }
	.pv-main { max-width: 1400px; margin: 0 auto; padding: 8px 28px 20px; }
	.btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border-color); background: #fff; color: var(--text-color); border-radius: 6px; padding: 6px 12px; font: 600 12.5px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
	.btn-xs { padding: 3px 8px; font-size: 11.5px; }
	.btn-primary { background: #2f5bd3; border-color: #2f5bd3; color: #fff; }
	.btn-danger { background: #dc2626; border-color: #dc2626; color: #fff; }
	.btn[disabled] { opacity: .5; cursor: not-allowed; }
	.form-control { border: 1px solid var(--border-color); background: var(--control-bg); border-radius: 6px; padding: 7px 10px; font: 13px "Segoe UI", system-ui, sans-serif; color: var(--text-color); }
	fieldset { border: 0; padding: 0; margin: 0; }
	a { color: var(--primary); }
	.fa { display: none; }
	.pv-toast { position: fixed; right: 20px; bottom: 20px; background: #111827; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; max-width: 420px; }
</style>
</head>
<body>
<div class="pv-top"><b>Pridict</b><span>Agent Studio</span><span class="pv-title"></span></div>
<div class="pv-main" id="wrapper"></div>
<script>
	const appRoot = "../../../pridict_app/pridict";
	const params = new URLSearchParams(location.search);
	const pageName = params.get("page") || "agent-registry";

	const load = (src) => new Promise((resolve, reject) => {
		const real = src.replace("/assets/pridict/", `${appRoot}/public/`);
		const el = real.endsWith(".css") ? Object.assign(document.createElement("link"), { rel: "stylesheet", href: real })
			: Object.assign(document.createElement("script"), { src: real });
		el.onload = resolve;
		el.onerror = () => reject(new Error(`Could not load ${real}`));
		document.head.appendChild(el);
	});

	window.__ = (text) => text;
	window.frappe = {
		pages: { [pageName]: {} },
		utils: { escape_html: (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]) },
		require: async (assets) => { for (const a of [].concat(assets)) await load(a); },
		set_route: (route) => { location.search = `?page=${route}`; },
		show_alert: ({ message }) => {
			const toast = Object.assign(document.createElement("div"), { className: "pv-toast", textContent: message });
			document.body.appendChild(toast);
			setTimeout(() => toast.remove(), 3500);
		},
		ui: {
			make_app_page: ({ parent, title }) => {
				document.title = `${title} · Agent Studio preview`;
				const main = document.createElement("div");
				parent.appendChild(main);
				return { main: { get: () => main } };
			},
		},
	};

	(async () => {
		const folder = pageName.replace(/-/g, "_");
		await load(`${appRoot}/pridict/page/${folder}/${folder}.js`);
		await frappe.pages[pageName].on_page_load(document.getElementById("wrapper"));
		const click = params.get("click");
		if (click) document.querySelector(click)?.click();
		document.body.dataset.ready = "1";
	})().catch((err) => { document.getElementById("wrapper").textContent = err.message; });
</script>
</body>
</html>
