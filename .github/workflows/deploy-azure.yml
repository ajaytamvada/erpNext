name: Deploy ERPNext to Azure Container Apps (Serverless)

on:
  push:
    branches:
      - version-15
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: riditstackerpnextregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Docker Image to ACR
        run: |
          docker build -t riditstackerpnextregistry.azurecr.io/erpnext:${{ github.sha }} -t riditstackerpnextregistry.azurecr.io/erpnext:latest .
          docker push riditstackerpnextregistry.azurecr.io/erpnext:${{ github.sha }}
          docker push riditstackerpnextregistry.azurecr.io/erpnext:latest

      - name: Deploy Image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: riditstackerpnextregistry
          containerAppName: riditstackerpnextregistry
          resourceGroup: erpnext-rg
          imageToDeploy: riditstackerpnextregistry.azurecr.io/erpnext:${{ github.sha }}
