name: Deploy ERPNext to Azure Container Apps (Serverless)

on:
  push:
    branches:
      - version-15
      - main
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: riditstackerpnextregistry-adexhta0crd8b4e3.azurecr.io
  CONTAINER_APP_NAME: riditstackerpnextregistry
  RESOURCE_GROUP: rg-erpnext

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Docker Image to ACR
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/erpnext:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/erpnext:latest .
          docker push ${{ env.ACR_LOGIN_SERVER }}/erpnext:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/erpnext:latest

      - name: Set Container App Registry Credentials
        run: |
          az containerapp registry set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server ${{ env.ACR_LOGIN_SERVER }} \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password "${{ secrets.ACR_PASSWORD }}"

      - name: Deploy Image to Azure Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/erpnext:${{ github.sha }} \
            --target-port 8000 \
            --ingress external
