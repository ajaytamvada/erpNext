name: Deploy ERPNext to Azure Container Apps (Serverless)

on:
  push:
    branches:
      - version-15
      - main
  workflow_dispatch:

# Environment Configuration (Public resource names)
env:
  ACR_NAME: riditstackerpnextregistry
  CONTAINER_APP_NAME: riditstackerpnextregistry
  RESOURCE_GROUP: erpnext-rg

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure Container Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Docker Image to ACR
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/erpnext:${{ github.sha }} -t ${{ env.ACR_NAME }}.azurecr.io/erpnext:latest .
          docker push ${{ env.ACR_NAME }}.azurecr.io/erpnext:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/erpnext:latest

      - name: Deploy Image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ env.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/erpnext:${{ github.sha }}
